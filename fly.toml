app = "simplesense-co"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine warm so background sync jobs (server-action `after()` backfill+analysis)
  # aren't killed when the proxy sees no inbound requests. auto_stop still parks extra machines.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
