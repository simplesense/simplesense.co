app = "simplesense-co"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine warm so background sync jobs (server-action `after()` backfill+analysis)
  # aren't killed when the proxy sees no inbound requests. auto_stop still parks extra machines.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Gate rollouts on a booting app: a release that crashes on boot (e.g. assertServerEnv
  # throwing on a bad env) fails its health check and Fly keeps the previous version serving.
  [[http_service.checks]]
    method = "get"
    path = "/api/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
