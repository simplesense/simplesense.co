<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 24px 32px; color: var(--text-body); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; }
  .lbl { width: 90px; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  .s700 { font-weight: 700; color: var(--text-strong); font-size: 18px; }
  .s600 { font-weight: 600; color: var(--text-strong); font-size: 16px; }
  .s500 { font-weight: 500; color: var(--text-body); font-size: 15px; }
  .s400 { font-weight: 400; color: var(--text-body); font-size: 15px; }
</style>
</head>
<body>
  <div class="r"><span class="lbl">Bold 700</span><span class="s700">The 3 highest-ROI moves this week</span></div>
  <div class="r"><span class="lbl">Semibold 600</span><span class="s600">Geo-fence Meta &amp; Google to a 5-mile radius</span></div>
  <div class="r"><span class="lbl">Medium 500</span><span class="s500">Build the top-20% Klaviyo segment</span></div>
  <div class="r"><span class="lbl">Regular 400</span><span class="s400">SimpleSense reads your whole store and tells you what to change next.</span></div>
</body>
</html>
