<!-- @dsCard group="Type" viewport="700x200" name="Display — Instrument Serif" subtitle="Editorial headlines, big numbers, pull quotes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 28px 32px; }
  .big { font-family: var(--font-display); font-weight: 400; font-size: 56px; line-height: 1.02; letter-spacing: -0.02em; color: var(--text-strong); }
  .big em { font-style: italic; }
  .meta { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 14px; }
</style>
</head>
<body>
  <div class="big">Stop drowning in data.<br><em>Start executing.</em></div>
  <div class="meta">Instrument Serif · 400 / italic · line-height 1.02 · tracking −0.02em</div>
</body>
</html>
