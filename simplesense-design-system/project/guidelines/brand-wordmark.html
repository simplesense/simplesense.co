<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 28px 32px; }
  .mark { font-family: var(--font-display); font-size: 38px; letter-spacing: 0.18em; color: var(--text-strong); text-transform: uppercase; }
  .eye { margin-top: 22px; }
  .note { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 8px; }
</style>
</head>
<body>
  <div class="mark">SimpleSense</div>
  <div class="eye"><span class="ss-eyebrow">The prescriptive operator brain</span></div>
  <div class="note">.ss-eyebrow · Inter 600 · tracking 0.16em · clay</div>
</body>
</html>
