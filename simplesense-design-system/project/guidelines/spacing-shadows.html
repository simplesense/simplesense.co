<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Warm-tinted, soft — never hard slate" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); }
  .wrap { display: flex; gap: 26px; padding: 32px; align-items: center; }
  .c { width: 110px; height: 70px; background: var(--surface-card); border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .name { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <div><div class="c" style="box-shadow:var(--shadow-xs)"></div><div class="name">xs</div></div>
    <div><div class="c" style="box-shadow:var(--shadow-sm)"></div><div class="name">sm</div></div>
    <div><div class="c" style="box-shadow:var(--shadow-md)"></div><div class="name">md</div></div>
    <div><div class="c" style="box-shadow:var(--shadow-lg)"></div><div class="name">lg</div></div>
  </div>
</body>
</html>
