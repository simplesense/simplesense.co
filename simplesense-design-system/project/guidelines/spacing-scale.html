<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base — generous in marketing, denser in app" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 22px 32px; }
  .r { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
  .lbl { width: 86px; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  .bar { height: 14px; background: var(--ss-clay-300); border-radius: 3px; }
</style>
</head>
<body>
  <div class="r"><span class="lbl">2 · 8px</span><span class="bar" style="width:8px"></span></div>
  <div class="r"><span class="lbl">4 · 16px</span><span class="bar" style="width:16px"></span></div>
  <div class="r"><span class="lbl">5 · 24px</span><span class="bar" style="width:24px"></span></div>
  <div class="r"><span class="lbl">6 · 32px</span><span class="bar" style="width:32px"></span></div>
  <div class="r"><span class="lbl">7 · 48px</span><span class="bar" style="width:48px"></span></div>
  <div class="r"><span class="lbl">9 · 96px</span><span class="bar" style="width:96px"></span></div>
</body>
</html>
