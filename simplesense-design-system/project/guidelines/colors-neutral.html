<!-- @dsCard group="Colors" viewport="700x180" name="Warm Neutrals" subtitle="Cream / taupe foundation — the warm rework of Athena slate" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { display: flex; gap: 12px; padding: 20px; flex-wrap: wrap; }
  .sw { width: 100px; }
  .chip { height: 56px; border-radius: var(--radius-sm); border: 1px solid var(--border-hairline); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); margin-top: 8px; }
  .hex { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--ss-cream)"></div><div class="name">Cream / page</div><div class="hex">#f4f1ea</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-paper)"></div><div class="name">Paper / card</div><div class="hex">#fffdf9</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-sand)"></div><div class="name">Sand / soft</div><div class="hex">#ece7dc</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-border-2)"></div><div class="name">Divider</div><div class="hex">#d8cfbd</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-muted)"></div><div class="name">Muted</div><div class="hex">#837a68</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-ink-soft)"></div><div class="name">Body</div><div class="hex">#4a4234</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-ink)"></div><div class="name">Ink</div><div class="hex">#211c15</div></div>
  </div>
</body>
</html>
