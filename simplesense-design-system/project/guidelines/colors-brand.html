<!-- @dsCard group="Colors" viewport="700x150" name="Brand & Action" subtitle="Signal blue carries all primary action; clay adds warmth" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { display: flex; gap: 14px; padding: 20px; flex-wrap: wrap; }
  .sw { width: 116px; }
  .chip { height: 60px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,.06); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); margin-top: 8px; }
  .hex { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--ss-blue-500)"></div><div class="name">Primary</div><div class="hex">#0871e7</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-blue-600)"></div><div class="name">Hover</div><div class="hex">#0860c4</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-blue-700)"></div><div class="name">Active</div><div class="hex">#074fa0</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-clay-500)"></div><div class="name">Clay accent</div><div class="hex">#c25a3c</div></div>
    <div class="sw"><div class="chip" style="background:var(--ss-blossom-300)"></div><div class="name">Blossom</div><div class="hex">#e8a0b4</div></div>
  </div>
</body>
</html>
