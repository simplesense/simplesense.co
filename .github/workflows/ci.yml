name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build web (catches Next-build-only failures before deploy)
        run: pnpm --filter @ss/web build
        env:
          # Build only needs to compile; a dummy Clerk key keeps the ClerkProvider build path
          # exercised without real credentials.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_build_only
